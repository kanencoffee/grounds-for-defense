<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 120">
  <defs>
    <radialGradient id="halo" cx="0.5" cy="0.4"><stop offset="0" stop-color="#fff5d6" stop-opacity="0.6"/><stop offset="1" stop-color="#f0c987" stop-opacity="0"/></radialGradient>
    <linearGradient id="apron" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5c3a1c"/><stop offset="1" stop-color="#3d2817"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d4a8"/><stop offset="1" stop-color="#d4a574"/></linearGradient>
  </defs>
  <!-- protective halo glow -->
  <ellipse cx="48" cy="64" rx="56" ry="56" fill="url(#halo)"/>
  <!-- counter base -->
  <rect x="2" y="92" width="92" height="26" rx="3" fill="#5c3a1c" stroke="#1a1108" stroke-width="2"/>
  <rect x="2" y="92" width="92" height="4" fill="#8b5a2b"/>
  <line x1="20" y1="98" x2="20" y2="118" stroke="#1a1108" stroke-width="0.8" opacity="0.5"/>
  <line x1="48" y1="98" x2="48" y2="118" stroke="#1a1108" stroke-width="0.8" opacity="0.5"/>
  <line x1="76" y1="98" x2="76" y2="118" stroke="#1a1108" stroke-width="0.8" opacity="0.5"/>
  <!-- shadow -->
  <ellipse cx="48" cy="92" rx="32" ry="3" fill="#1a1108" opacity="0.4"/>
  <!-- body / apron -->
  <path d="M 24 56 L 18 92 L 78 92 L 72 56 Q 72 50 64 48 L 32 48 Q 24 50 24 56 Z" fill="url(#apron)" stroke="#1a1108" stroke-width="2"/>
  <!-- apron straps over shoulders -->
  <path d="M 32 48 L 30 30 Q 30 26 36 26" fill="none" stroke="#1a1108" stroke-width="2"/>
  <path d="M 64 48 L 66 30 Q 66 26 60 26" fill="none" stroke="#1a1108" stroke-width="2"/>
  <!-- apron pocket -->
  <rect x="36" y="68" width="24" height="14" fill="#3d2817" stroke="#1a1108" stroke-width="1.5" rx="1"/>
  <!-- coffee bean logo on apron -->
  <ellipse cx="48" cy="62" rx="5" ry="6" fill="#f0c987"/>
  <path d="M 48 56 Q 45 62 48 68" fill="none" stroke="#5c3a1c" stroke-width="1.2"/>
  <!-- arms -->
  <ellipse cx="22" cy="64" rx="6" ry="14" fill="url(#skin)" stroke="#1a1108" stroke-width="1.5"/>
  <ellipse cx="74" cy="64" rx="6" ry="14" fill="url(#skin)" stroke="#1a1108" stroke-width="1.5"/>
  <!-- left hand holding portafilter -->
  <circle cx="22" cy="80" r="4" fill="url(#skin)" stroke="#1a1108" stroke-width="1.5"/>
  <rect x="14" y="74" width="14" height="4" fill="#1a1108" rx="1"/>
  <circle cx="10" cy="76" r="4" fill="#888" stroke="#1a1108" stroke-width="1.5"/>
  <!-- right hand thumbs-up / fist -->
  <circle cx="74" cy="80" r="5" fill="url(#skin)" stroke="#1a1108" stroke-width="1.5"/>
  <!-- neck -->
  <rect x="42" y="32" width="12" height="14" fill="url(#skin)" stroke="#1a1108" stroke-width="1.5"/>
  <!-- head -->
  <circle cx="48" cy="24" r="14" fill="url(#skin)" stroke="#1a1108" stroke-width="2"/>
  <!-- hair -->
  <path d="M 34 22 Q 34 8 48 6 Q 62 8 62 22 Q 60 14 48 12 Q 36 14 34 22 Z" fill="#3d2817" stroke="#1a1108" stroke-width="1.5"/>
  <!-- determined eyebrows -->
  <path d="M 39 20 L 45 22" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
  <path d="M 51 22 L 57 20" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
  <!-- eyes -->
  <circle cx="42" cy="25" r="1.6" fill="#1a1108"/>
  <circle cx="54" cy="25" r="1.6" fill="#1a1108"/>
  <circle cx="42.5" cy="24.5" r="0.5" fill="#fff"/>
  <circle cx="54.5" cy="24.5" r="0.5" fill="#fff"/>
  <!-- determined mouth -->
  <path d="M 42 32 L 54 32" stroke="#1a1108" stroke-width="2" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="38" cy="28" rx="2" ry="1.2" fill="#e89b7a" opacity="0.5"/>
  <ellipse cx="58" cy="28" rx="2" ry="1.2" fill="#e89b7a" opacity="0.5"/>
  <!-- visor / cap -->
  <path d="M 32 14 L 64 14 L 64 18 L 32 18 Z" fill="#1a1108"/>
  <!-- name tag -->
  <rect x="56" y="58" width="12" height="6" fill="#fff" stroke="#1a1108" stroke-width="1"/>
  <text x="62" y="62.5" text-anchor="middle" font-family="sans-serif" font-size="3.2" font-weight="bold" fill="#1a1108">BARISTA</text>
</svg>
