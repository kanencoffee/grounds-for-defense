<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <!-- CURLY BARISTA — dark skin, curly hair, KANEN apron, friendly + warm (Kanen style) -->
  <rect width="240" height="320" fill="#dde8ee"/>
  <rect x="0" y="290" width="240" height="30" fill="#a08868"/>
  <line x1="0" y1="290" x2="240" y2="290" stroke="#3d2a18" stroke-width="2.5"/>
  <ellipse cx="120" cy="290" rx="58" ry="4" fill="#3d2a18" opacity="0.3"/>
  <!-- olive green tee under apron -->
  <path d="M 60 138 L 52 290 L 188 290 L 180 138 Q 178 120 162 114 L 144 122 L 120 132 L 96 122 L 78 114 Q 62 120 60 138 Z" fill="#5a7a4a" stroke="#3d2a18" stroke-width="2.5"/>
  <path d="M 96 122 L 120 132 L 144 122" fill="none" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- KANEN BROWN APRON -->
  <path d="M 76 132 L 68 290 L 172 290 L 164 132 Q 152 122 120 124 Q 88 122 76 132 Z" fill="#a08260"/>
  <path d="M 76 132 L 68 290 L 172 290 L 164 132 Q 152 122 120 124 Q 88 122 76 132 Z" fill="none" stroke="#3d2a18" stroke-width="2.5"/>
  <path d="M 96 124 L 92 100 Q 110 96 120 98 Q 130 96 148 100 L 144 124" fill="none" stroke="#3d2a18" stroke-width="2.5"/>
  <path d="M 120 124 L 164 132 L 172 290 L 130 290 Z" fill="#7a5c3a" opacity="0.5"/>
  <!-- KANEN logo on apron -->
  <text x="120" y="178" text-anchor="middle" font-family="Impact, Arial Black, sans-serif" font-size="16" font-weight="900" fill="#3d2a18">KANEN</text>
  <text x="120" y="190" text-anchor="middle" font-family="serif" font-size="8" font-style="italic" fill="#3d2a18" opacity="0.85">coffee</text>
  <!-- subtle bust contour through apron (tasteful) -->
  <path d="M 84 156 Q 100 174 120 174 Q 140 174 156 156" fill="none" stroke="#7a5c3a" stroke-width="1.8" opacity="0.6"/>
  <!-- arms (olive green) -->
  <path d="M 60 138 Q 50 188 60 240 L 78 240 Q 80 188 80 138 Z" fill="#5a7a4a" stroke="#3d2a18" stroke-width="2.5"/>
  <path d="M 180 138 Q 190 188 180 240 L 162 240 Q 160 188 160 138 Z" fill="#5a7a4a" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- hands -->
  <ellipse cx="68" cy="248" rx="10" ry="13" fill="#7a4a2a" stroke="#3d2a18" stroke-width="2.5"/>
  <ellipse cx="172" cy="248" rx="10" ry="13" fill="#7a4a2a" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- holding portafilter in right hand -->
  <circle cx="160" cy="232" r="10" fill="#888" stroke="#3d2a18" stroke-width="2.5"/>
  <rect x="156" y="236" width="14" height="6" fill="#3d2a18"/>
  <rect x="170" y="236" width="22" height="6" fill="#5c3a1c" stroke="#3d2a18" stroke-width="2"/>
  <!-- neck -->
  <rect x="108" y="100" width="24" height="20" fill="#7a4a2a" stroke="#3d2a18" stroke-width="2.5"/>
  <rect x="120" y="100" width="12" height="20" fill="#5a3018" opacity="0.5"/>
  <!-- HEAD: oval -->
  <ellipse cx="120" cy="72" rx="34" ry="38" fill="#7a4a2a" stroke="#3d2a18" stroke-width="2.5"/>
  <ellipse cx="86" cy="74" rx="5" ry="8" fill="#7a4a2a" stroke="#3d2a18" stroke-width="2.5"/>
  <ellipse cx="154" cy="74" rx="5" ry="8" fill="#7a4a2a" stroke="#3d2a18" stroke-width="2.5"/>
  <path d="M 120 34 Q 154 34 154 72 Q 154 102 120 110 Z" fill="#5a3018" opacity="0.4"/>
  <!-- BIG NATURAL CURLY HAIR (the look) -->
  <circle cx="84" cy="42" r="13" fill="#1a0808" stroke="#3d2a18" stroke-width="2.5"/>
  <circle cx="104" cy="28" r="14" fill="#1a0808" stroke="#3d2a18" stroke-width="2.5"/>
  <circle cx="120" cy="22" r="14" fill="#1a0808" stroke="#3d2a18" stroke-width="2.5"/>
  <circle cx="136" cy="28" r="14" fill="#1a0808" stroke="#3d2a18" stroke-width="2.5"/>
  <circle cx="156" cy="42" r="13" fill="#1a0808" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- hair forehead arc -->
  <path d="M 88 56 Q 96 38 120 36 Q 144 38 152 56 Q 144 46 120 44 Q 96 46 88 56 Z" fill="#1a0808" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- gold hoop earrings -->
  <circle cx="84" cy="82" r="3.5" fill="none" stroke="#d8a830" stroke-width="2"/>
  <circle cx="156" cy="82" r="3.5" fill="none" stroke="#d8a830" stroke-width="2"/>
  <!-- subtle eyebrows -->
  <path d="M 96 64 Q 104 60 110 64" stroke="#1a0808" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 130 64 Q 136 60 144 64" stroke="#1a0808" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- DOT EYES with shine -->
  <circle cx="103" cy="74" r="2.8" fill="#1a0808"/>
  <circle cx="137" cy="74" r="2.8" fill="#1a0808"/>
  <circle cx="104" cy="73" r="0.8" fill="#fff"/>
  <circle cx="138" cy="73" r="0.8" fill="#fff"/>
  <!-- subtle nose -->
  <path d="M 120 84 Q 117 92 120 96" stroke="#5a3018" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- big warm smile -->
  <path d="M 104 100 Q 120 110 136 100" stroke="#3d2a18" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 108 102 Q 120 108 132 102" fill="#a8484a" opacity="0.4"/>
  <!-- cheek tint -->
  <ellipse cx="98" cy="92" rx="5" ry="3" fill="#d83040" opacity="0.4"/>
  <ellipse cx="142" cy="92" rx="5" ry="3" fill="#d83040" opacity="0.4"/>
</svg>
