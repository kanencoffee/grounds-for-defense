<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="240" height="320">
  <!-- THE CUSTOMER — silver-haired gentleman, polo shirt, friendly customer (Kanen style match) -->
  <rect width="240" height="320" fill="#dde8ee"/>
  <!-- floor line -->
  <rect x="0" y="290" width="240" height="30" fill="#a08868"/>
  <line x1="0" y1="290" x2="240" y2="290" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- shadow -->
  <ellipse cx="120" cy="290" rx="58" ry="4" fill="#3d2a18" opacity="0.3"/>
  <!-- gray slacks -->
  <path d="M 88 200 L 80 290 L 108 290 L 116 220 L 124 220 L 132 290 L 160 290 L 152 200 Z" fill="#8a96a4"/>
  <path d="M 88 200 L 80 290 L 108 290 L 116 220 L 124 220 L 132 290 L 160 290 L 152 200 Z" fill="none" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- belt -->
  <rect x="84" y="194" width="72" height="10" fill="#5a3a2a"/>
  <rect x="84" y="194" width="72" height="10" fill="none" stroke="#3d2a18" stroke-width="2.5"/>
  <rect x="116" y="195" width="8" height="8" fill="#c8a830" stroke="#3d2a18" stroke-width="1.5"/>
  <!-- BLUE POLO SHIRT -->
  <path d="M 64 140 L 60 198 L 156 198 L 152 140 Q 152 122 138 116 L 124 122 L 116 132 Q 110 122 96 116 Q 80 122 80 130 Q 70 130 64 140 Z" fill="#7a96b4"/>
  <!-- collar (polo) -->
  <path d="M 96 116 L 116 132 L 124 122 L 138 116" fill="#7a96b4" stroke="#3d2a18" stroke-width="2.5"/>
  <path d="M 102 122 L 116 134 L 124 124 L 132 120" fill="none" stroke="#3d2a18" stroke-width="2"/>
  <!-- polo body outline -->
  <path d="M 64 140 L 60 198 L 156 198 L 152 140 Q 152 122 138 116 L 124 122 L 116 132 Q 110 122 96 116 Q 80 122 80 130 Q 70 130 64 140 Z" fill="none" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- 2-button placket -->
  <line x1="120" y1="132" x2="120" y2="160" stroke="#3d2a18" stroke-width="2"/>
  <circle cx="120" cy="142" r="2" fill="#3d2a18"/>
  <circle cx="120" cy="155" r="2" fill="#3d2a18"/>
  <!-- shirt cel-shade (one tone) -->
  <path d="M 120 132 L 152 140 L 156 198 L 130 198 Z" fill="#5a7894" opacity="0.5"/>
  <!-- arms -->
  <path d="M 64 140 Q 50 180 56 220 L 76 218 Q 80 178 80 140 Z" fill="#7a96b4" stroke="#3d2a18" stroke-width="2.5"/>
  <path d="M 152 140 Q 166 180 160 220 L 140 218 Q 136 178 136 140 Z" fill="#7a96b4" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- arm shading -->
  <path d="M 152 140 L 166 180 L 160 220 L 140 218" fill="#5a7894" opacity="0.5"/>
  <!-- hands -->
  <ellipse cx="60" cy="226" rx="10" ry="13" fill="#e8c4a0" stroke="#3d2a18" stroke-width="2.5"/>
  <ellipse cx="156" cy="226" rx="10" ry="13" fill="#e8c4a0" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- neck -->
  <rect x="106" y="100" width="28" height="22" fill="#e8c4a0" stroke="#3d2a18" stroke-width="2.5"/>
  <rect x="120" y="100" width="14" height="22" fill="#c8a484" opacity="0.5"/>
  <!-- HEAD: rounded oval -->
  <ellipse cx="120" cy="74" rx="36" ry="40" fill="#e8c4a0" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- ears -->
  <ellipse cx="84" cy="76" rx="6" ry="9" fill="#e8c4a0" stroke="#3d2a18" stroke-width="2.5"/>
  <ellipse cx="156" cy="76" rx="6" ry="9" fill="#e8c4a0" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- face cel-shade (right side) -->
  <path d="M 120 38 Q 156 38 156 74 Q 156 108 120 114 Z" fill="#c8a484" opacity="0.4"/>
  <!-- SILVER SPIKY HAIR -->
  <path d="M 84 60 Q 84 30 100 26 L 102 16 L 110 26 L 116 14 L 124 26 L 132 14 L 140 26 L 144 18 Q 156 30 156 60 Q 152 40 144 36 Q 130 32 120 32 Q 108 32 96 36 Q 88 40 84 60 Z" fill="#c8d4dc"/>
  <path d="M 84 60 Q 84 30 100 26 L 102 16 L 110 26 L 116 14 L 124 26 L 132 14 L 140 26 L 144 18 Q 156 30 156 60 Q 152 40 144 36 Q 130 32 120 32 Q 108 32 96 36 Q 88 40 84 60 Z" fill="none" stroke="#3d2a18" stroke-width="2.5"/>
  <!-- hair shading -->
  <path d="M 120 32 Q 144 36 152 40 Q 156 50 156 60 Q 144 36 120 32 Z" fill="#a8b8c4" opacity="0.6"/>
  <!-- subtle eyebrows (gray) -->
  <path d="M 96 68 L 110 70" stroke="#5a6878" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 130 70 L 144 68" stroke="#5a6878" stroke-width="2.5" stroke-linecap="round"/>
  <!-- DOT EYES (Kanen style) -->
  <circle cx="103" cy="78" r="2.5" fill="#3d2a18"/>
  <circle cx="137" cy="78" r="2.5" fill="#3d2a18"/>
  <!-- subtle nose hint -->
  <path d="M 120 84 Q 117 92 120 96" stroke="#3d2a18" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- gentle friendly smile -->
  <path d="M 108 100 Q 120 106 132 100" stroke="#3d2a18" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- subtle cheek tint -->
  <ellipse cx="98" cy="90" rx="5" ry="3" fill="#e89a82" opacity="0.4"/>
  <ellipse cx="142" cy="90" rx="5" ry="3" fill="#e89a82" opacity="0.4"/>
</svg>
