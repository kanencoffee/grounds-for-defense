<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- DOODLE / SKETCHY — wobbly hand-drawn lines, marker on lined paper -->
  <defs>
    <pattern id="lines" x="0" y="0" width="128" height="12" patternUnits="userSpaceOnUse">
      <line x1="0" y1="11" x2="128" y2="11" stroke="#bcd8ee" stroke-width="0.8"/>
    </pattern>
  </defs>
  <!-- notebook paper bg -->
  <rect width="128" height="128" fill="#fffce8"/>
  <rect width="128" height="128" fill="url(#lines)"/>
  <!-- left margin red line -->
  <line x1="14" y1="0" x2="14" y2="128" stroke="#e8b0b0" stroke-width="1"/>
  <!-- 3-hole punch dots -->
  <circle cx="6" cy="32" r="2" fill="#fff" stroke="#999" stroke-width="0.5"/>
  <circle cx="6" cy="64" r="2" fill="#fff" stroke="#999" stroke-width="0.5"/>
  <circle cx="6" cy="96" r="2" fill="#fff" stroke="#999" stroke-width="0.5"/>
  <!-- bean body — wobbly multi-stroke outline -->
  <path d="M 64 22 Q 68 22 72 24 Q 90 26 100 44 Q 108 64 102 84 Q 96 100 80 104 Q 64 108 48 104 Q 32 100 26 84 Q 20 64 28 44 Q 38 26 56 24 Q 60 22 64 22 Z" fill="#a87a4a" stroke="#3d2817" stroke-width="3" stroke-linecap="round"/>
  <!-- second wobbly outline (overdrawn marker feel) -->
  <path d="M 64 24 Q 70 24 74 26 Q 88 28 98 46 Q 105 64 100 82 Q 94 98 80 102 Q 64 106 50 102 Q 34 98 28 82 Q 22 64 30 46 Q 40 28 54 26 Q 60 24 64 24" fill="none" stroke="#1a1108" stroke-width="1.5" opacity="0.6"/>
  <!-- center crease (wobbly) -->
  <path d="M 64 24 Q 58 36 60 50 Q 64 64 58 78 Q 60 92 64 104" stroke="#1a1108" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- crosshatch shading on right side -->
  <g stroke="#5c3a1c" stroke-width="1" opacity="0.5">
    <line x1="76" y1="40" x2="86" y2="48"/>
    <line x1="74" y1="46" x2="88" y2="54"/>
    <line x1="78" y1="54" x2="90" y2="60"/>
    <line x1="76" y1="62" x2="92" y2="66"/>
    <line x1="80" y1="68" x2="88" y2="72"/>
    <line x1="78" y1="76" x2="90" y2="80"/>
  </g>
  <!-- eyes (wobbly circles) -->
  <ellipse cx="46" cy="62" rx="4" ry="5" fill="#fff" stroke="#1a1108" stroke-width="2"/>
  <ellipse cx="78" cy="62" rx="4" ry="5" fill="#fff" stroke="#1a1108" stroke-width="2"/>
  <circle cx="46" cy="64" r="2" fill="#1a1108"/>
  <circle cx="78" cy="64" r="2" fill="#1a1108"/>
  <!-- wobbly droopy brows -->
  <path d="M 36 50 Q 42 52 50 56" stroke="#1a1108" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 74 56 Q 82 52 90 50" stroke="#1a1108" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- wobbly frown -->
  <path d="M 46 84 Q 52 80 58 82 Q 64 78 72 82 Q 78 78 82 84" stroke="#1a1108" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- sketchy mold spot -->
  <circle cx="86" cy="78" r="6" fill="#9ad06a" stroke="#3a5a2a" stroke-width="1.5"/>
  <circle cx="86" cy="78" r="3" fill="#3a5a2a" opacity="0.6"/>
  <!-- handwritten "stale" tag -->
  <g transform="rotate(-12 100 24)">
    <text x="100" y="28" font-family="cursive, serif" font-size="11" fill="#c8302c" font-style="italic">stale!</text>
    <line x1="98" y1="29" x2="118" y2="29" stroke="#c8302c" stroke-width="1.5"/>
  </g>
  <!-- doodle arrows -->
  <path d="M 20 50 L 30 56 L 28 52 M 30 56 L 26 56" stroke="#3d2817" stroke-width="1.5" fill="none" stroke-linecap="round"/>
</svg>
