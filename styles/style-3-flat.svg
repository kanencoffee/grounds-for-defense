<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- FLAT VECTOR / MINIMALIST — clean shapes, no outlines, modern app-icon look -->
  <!-- background subtle pastel -->
  <rect width="128" height="128" fill="#f5e8d6" rx="16"/>
  <!-- soft ground shadow -->
  <ellipse cx="64" cy="108" rx="36" ry="3" fill="#1a1108" opacity="0.15"/>
  <!-- bean body — flat tan -->
  <ellipse cx="64" cy="64" rx="40" ry="44" fill="#a87a4a"/>
  <!-- shadow — flat darker brown half -->
  <path d="M 64 20 Q 100 22 104 64 Q 100 106 64 108 L 64 64 Z" fill="#7a5022"/>
  <!-- center crease — single thin line -->
  <path d="M 64 22 Q 60 64 64 106" stroke="#5c3a1c" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- minimalist eyes (just dots) -->
  <circle cx="48" cy="62" r="3" fill="#3d2817"/>
  <circle cx="80" cy="62" r="3" fill="#3d2817"/>
  <!-- minimalist mold spot -->
  <circle cx="84" cy="80" r="6" fill="#7aa84a"/>
  <!-- minimalist frown — single curve -->
  <path d="M 50 82 Q 64 76 78 82" stroke="#3d2817" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- subtle dust dot accents -->
  <circle cx="22" cy="36" r="1.5" fill="#a87a4a" opacity="0.6"/>
  <circle cx="106" cy="40" r="1.5" fill="#a87a4a" opacity="0.6"/>
  <circle cx="106" cy="84" r="1.5" fill="#a87a4a" opacity="0.6"/>
</svg>
