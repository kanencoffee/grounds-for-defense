<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges">
  <!-- PIXEL ART (16-bit RPG) — limited palette, chunky 4px pixels -->
  <!-- background sky / floor accent -->
  <rect width="128" height="128" fill="#2b1d12"/>
  <!-- bean body — built from 4x4 pixel rectangles, brown-black gradient -->
  <g fill="#9a7042">
    <rect x="48" y="24" width="32" height="4"/>
    <rect x="40" y="28" width="48" height="4"/>
    <rect x="36" y="32" width="56" height="8"/>
    <rect x="32" y="40" width="64" height="40"/>
    <rect x="36" y="80" width="56" height="8"/>
    <rect x="40" y="88" width="48" height="4"/>
    <rect x="48" y="92" width="32" height="4"/>
  </g>
  <!-- mid tone -->
  <g fill="#7a5022">
    <rect x="32" y="60" width="64" height="20"/>
    <rect x="28" y="48" width="4" height="32"/>
    <rect x="96" y="48" width="4" height="32"/>
  </g>
  <!-- shadow side -->
  <g fill="#3d2817">
    <rect x="68" y="40" width="28" height="40"/>
    <rect x="60" y="80" width="32" height="8"/>
    <rect x="68" y="32" width="20" height="8"/>
  </g>
  <!-- highlight side -->
  <g fill="#c89060">
    <rect x="36" y="40" width="20" height="20"/>
    <rect x="32" y="44" width="16" height="12"/>
  </g>
  <!-- center crease (dark vertical line) -->
  <g fill="#1a1108">
    <rect x="60" y="24" width="4" height="68"/>
    <rect x="64" y="20" width="4" height="76"/>
  </g>
  <!-- eyes -->
  <rect x="44" y="56" width="8" height="8" fill="#fff"/>
  <rect x="76" y="56" width="8" height="8" fill="#fff"/>
  <rect x="48" y="60" width="4" height="4" fill="#000"/>
  <rect x="80" y="60" width="4" height="4" fill="#000"/>
  <!-- eyebrows (drooping) -->
  <rect x="40" y="48" width="16" height="4" fill="#1a1108"/>
  <rect x="72" y="48" width="16" height="4" fill="#1a1108"/>
  <!-- frown -->
  <rect x="48" y="76" width="32" height="4" fill="#1a1108"/>
  <rect x="44" y="80" width="4" height="4" fill="#1a1108"/>
  <rect x="80" y="80" width="4" height="4" fill="#1a1108"/>
  <!-- mold spot (green pixels) -->
  <rect x="84" y="68" width="8" height="8" fill="#5a8a3a"/>
  <rect x="88" y="64" width="4" height="4" fill="#5a8a3a"/>
  <rect x="86" y="70" width="4" height="4" fill="#3d5c2a"/>
  <!-- floating dust pixels -->
  <rect x="20" y="20" width="2" height="2" fill="#a89878"/>
  <rect x="104" y="24" width="2" height="2" fill="#a89878"/>
  <rect x="108" y="48" width="2" height="2" fill="#a89878"/>
  <rect x="20" y="56" width="2" height="2" fill="#a89878"/>
  <rect x="14" y="80" width="2" height="2" fill="#a89878"/>
  <rect x="110" y="84" width="2" height="2" fill="#a89878"/>
</svg>
