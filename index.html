<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Grounds for Defense</title>
<link rel="stylesheet" href="style.css" />
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="hud">
    <div class="hud-stat"><span class="lbl">Beans</span><span id="hud-beans">250</span></div>
    <div class="hud-stat"><span class="lbl">Wave</span><span id="hud-wave">0 / 10</span></div>
    <div class="hud-stat"><span class="lbl">Barista</span><span id="hud-hp">20</span></div>
    <button id="ability-btn" class="ability">☕ Perfect Shot</button>
    <button id="start-wave" class="start">Start Wave</button>
    <button id="mute-btn" class="mute" title="Mute">🔊</button>
  </div>
  <div id="game"></div>
  <div id="tower-picker" class="picker hidden">
    <div class="picker-title">Place Tower</div>
    <div class="tower-grid">
      <button data-tower="drip">Magnifier<br><span>50¢</span></button>
      <button data-tower="frother">Thermometer<br><span>75¢</span></button>
      <button data-tower="cold">Hydrometer<br><span>100¢</span></button>
      <button data-tower="grinder">Color Chart<br><span>120¢</span></button>
      <button data-tower="aeropress">Date Stamp<br><span>130¢</span></button>
      <button data-tower="espresso">Cupping Spoon<br><span>150¢</span></button>
      <button data-tower="pourover">Aroma Wheel<br><span>200¢</span></button>
    </div>
    <button class="cancel">Cancel</button>
  </div>
  <div id="tower-actions" class="picker hidden">
    <div class="picker-title">Tower</div>
    <div id="tower-info" class="tower-info"></div>
    <button id="upgrade-btn">Upgrade</button>
    <button id="sell-btn">Sell</button>
    <button class="cancel">Cancel</button>
  </div>
  <div id="mg-modal" class="overlay hidden">
    <div class="overlay-card mg-card">
      <h1 id="mg-title">Minigame</h1>
      <p id="mg-lesson"></p>
      <div id="mg-body"></div>
      <div id="mg-result" class="mg-result"></div>
      <button id="mg-skip" class="mg-skip-btn">Skip (no reward)</button>
    </div>
  </div>
  <div id="overlay" class="overlay hidden">
    <div class="overlay-card">
      <h1 id="overlay-title">Defend the Brew</h1>
      <p id="overlay-msg">Place towers near the path. Click Start Wave when ready.</p>
      <div id="char-select" class="char-select hidden">
        <div class="char-select-label">Choose your defender</div>
        <div class="char-grid"></div>
      </div>
      <button id="overlay-btn">Begin</button>
    </div>
  </div>
  <div id="copyright-corner">
    © 2026 Kanen Coffee, LLC. All Rights Reserved. ·
    <a href="legal/terms.html" target="_blank">Terms</a> ·
    <a href="legal/privacy.html" target="_blank">Privacy</a>
  </div>
  <script src="audio.js"></script>
  <script src="minigames.js"></script>
  <script src="game.js"></script>
</body>
</html>
